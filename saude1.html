<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PenseQuiz — Quizzes Médicos Profissionais</title>
    <meta name="description" content="MedPense — Plataforma profissional de quizzes e simulados médicos. Terminologia, ECG, Clínica, Prescrição e mais.">
    <meta name="keywords" content="quiz médico, terminologia médica, ECG, simulador clínico, medicina">
    <meta name="author" content="MedPense">
    <meta name="robots" content="index, follow">
    
    <link rel="icon" type="image/png" href="iconepq.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0a58ca;
            --primary-light: #e7f1ff;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            padding: 32px 28px 24px;
            text-align: center;
            background: linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
            border-bottom: 1px solid var(--border);
        }

        .logo-container {
            margin-bottom: 16px;
        }

        .logo-container img {
            width: 220px;
            max-width: 80%;
            height: auto;
        }

        .brand {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }

        .brand span {
            color: var(--primary);
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .buttons {
            padding: 24px 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card);
            color: var(--text);
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.98rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .button:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgb(13 110 253 / 0.25);
        }

        .button:active {
            transform: translateY(0);
        }

        .button i {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 10px;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .button:hover i {
            background: var(--primary);
            color: white;
        }

        .footer {
            padding: 20px 24px 28px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: #fafbfc;
        }

        .footer p {
            margin-bottom: 6px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer .copyright {
            margin-top: 12px;
            font-size: 0.75rem;
            opacity: 0.8;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 24px 20px 20px;
            }
            .brand {
                font-size: 1.45rem;
            }
            .buttons {
                padding: 20px 16px 24px;
            }
            .button {
                padding: 14px 16px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            
            <div class="brand">Pense<span>Quiz</span></div>
            <div class="tagline">Quizzes & Simulados Médicos</div>
        </div>

        <div class="buttons">
            <a href="terminologia_medica.html" class="button">
                <i class="fas fa-book-medical"></i>
                Terminologia Médica
            </a>
            <a href="resumomedicina.html" class="button">
                <i class="fas fa-notes-medical"></i>
                Resumo Med
            </a>
            <a href="gamerECG.html" class="button">
                <i class="fas fa-heartbeat"></i>
                Desafio ECG
            </a>
            <a href="menudesafiomed.html" class="button">
                <i class="fas fa-graduation-cap"></i>
                Ciclo Básico Pro
            </a>
            <a href="gamerclinica.html" class="button">
                <i class="fas fa-stethoscope"></i>
                Simulador Clínico
            </a>
            <a href="gamesprescricao.html" class="button">
                <i class="fas fa-prescription"></i>
                Prescrição Game
            </a>
            <a href="gamevermelha.html" class="button">
                <i class="fas fa-ambulance"></i>
                Sala Vermelha Game
            </a>
            <a href="quizmedbio.html" class="button">
                <i class="fas fa-dna"></i>
                Quiz BioMed
            </a>
        </div>

        <div class="footer">
            <p>Contato: <a href="mailto:juniosilvasouza@yahoo.com.br">juniosilvasouza@yahoo.com.br</a></p>
            <p>Telefone: <a href="tel:+5592988562216">(92) 98856-2216</a></p>
            <p class="copyright">© PenseQuiz — Todos os direitos reservados</p>
        </div>
    </div>

</body>
</html>
