<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Diluição | PenseQuiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0d6efd;
      --primary-dark: #0a58ca;
      --primary-light: #e7f1ff;
      --accent: #20c997;
      --danger: #e35d6a;
      --bg: #f0f4f8;
      --bg-card: #ffffff;
      --bg-sidebar: #ffffff;
      --text: #1a1d21;
      --text-muted: #6c757d;
      --border: #e2e8f0;
      --shadow: 0 4px 24px rgba(0,0,0,0.07);
      --radius: 14px;
      --header-bg: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
      --tag-bg: #e7f1ff;
      --tag-color: #0d6efd;
      --section-bg: #f8fafc;
      --transition: all 0.22s ease;
    }

    [data-theme="dark"] {
      --primary: #4d9fff;
      --primary-dark: #3a8aef;
      --primary-light: #1a2a3a;
      --accent: #2dd4a8;
      --danger: #f07178;
      --bg: #0f1419;
      --bg-card: #1a2332;
      --bg-sidebar: #1a2332;
      --text: #e8edf2;
      --text-muted: #8b9cb3;
      --border: #2a3544;
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
      --header-bg: linear-gradient(135deg, #1a3a6b 0%, #0d2144 100%);
      --tag-bg: #1e3a5f;
      --tag-color: #6bb3ff;
      --section-bg: #141c28;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: var(--header-bg);
      color: white;
      padding: 0.9rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
    }

    .header-content {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.18);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .logo h1 { font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
    .logo span { font-size: 0.7rem; opacity: 0.8; font-weight: 400; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      max-width: 520px;
      justify-content: flex-end;
    }

    .search-box {
      flex: 1;
      position: relative;
      max-width: 380px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.6rem;
      border: none;
      border-radius: 50px;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.95);
      color: #1a1d21;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .search-box input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.35);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .theme-btn, .menu-toggle {
      background: rgba(255,255,255,0.18);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .theme-btn:hover, .menu-toggle:hover { background: rgba(255,255,255,0.3); }
    .menu-toggle { display: none; }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 920px) {
      .container { grid-template-columns: 1fr; }
      .menu-toggle { display: flex; }
    }

    .sidebar {
      background: var(--bg-sidebar);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem;
      height: fit-content;
      position: sticky;
      top: 80px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .sidebar h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      font-weight: 600;
    }

    .category-list { list-style: none; display: flex; flex-direction: column; gap: 0.25rem; }

    .category-btn {
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.75rem;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.84rem;
      color: var(--text);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }

    .category-btn:hover { background: var(--primary-light); color: var(--primary); }
    .category-btn.active { background: var(--primary); color: white; font-weight: 500; }

    .category-btn .count {
      font-size: 0.7rem;
      background: rgba(0,0,0,0.07);
      padding: 0.12rem 0.4rem;
      border-radius: 20px;
      min-width: 22px;
      text-align: center;
    }

    .category-btn.active .count { background: rgba(255,255,255,0.22); }

    .results-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
    }

    .results-header h2 { font-size: 1.25rem; font-weight: 700; }

    .results-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.1rem;
    }

    .med-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: var(--transition);
      cursor: pointer;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .med-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      border-color: var(--primary);
    }

    .med-card-header {
      padding: 1rem 1.15rem 0.65rem;
      border-bottom: 1px solid var(--border);
    }

    .category-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.18rem 0.5rem;
      border-radius: 5px;
      background: var(--tag-bg);
      color: var(--tag-color);
      margin-bottom: 0.4rem;
    }

    .med-card-header h3 { font-size: 1.05rem; font-weight: 650; line-height: 1.3; }
    .med-card-header .subtitle { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.15rem; }

    .med-card-body {
      padding: 0.85rem 1.15rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .info-row { display: flex; gap: 0.4rem; font-size: 0.82rem; }
    .info-row .label { font-weight: 550; color: var(--text-muted); min-width: 58px; flex-shrink: 0; }
    .info-row .value { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .med-card-footer {
      padding: 0.65rem 1.15rem;
      background: var(--section-bg);
      display: flex;
      justify-content: flex-end;
    }

    .btn-detail {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.4rem 0.95rem;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 550;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-detail:hover { background: var(--primary-dark); }

    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active { display: flex; opacity: 1; }

    .modal {
      background: var(--bg-card);
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      transform: translateY(18px);
      transition: transform 0.3s ease;
      border: 1px solid var(--border);
    }

    .modal-overlay.active .modal { transform: translateY(0); }

    .modal-header {
      padding: 1.35rem 1.4rem 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-card);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .modal-header h2 { font-size: 1.3rem; font-weight: 750; }
    .modal-header .category { font-size: 0.75rem; color: var(--primary); font-weight: 650; margin-bottom: 0.25rem; }

    .modal-close {
      background: var(--section-bg);
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
      color: var(--text);
    }

    .modal-close:hover { background: var(--border); }

    .modal-body {
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .detail-section {
      background: var(--section-bg);
      border-radius: 10px;
      padding: 0.95rem 1.1rem;
      border: 1px solid var(--border);
    }

    .detail-section h4 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 0.45rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .detail-section p, .detail-section ul { font-size: 0.92rem; color: var(--text); }
    .detail-section ul { padding-left: 1.15rem; margin-top: 0.25rem; }
    .detail-section li { margin-bottom: 0.22rem; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }

    @media (max-width: 600px) {
      .detail-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 920px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -290px;
        width: 280px;
        height: 100vh;
        z-index: 150;
        transition: left 0.3s ease;
        border-radius: 0;
        max-height: 100vh;
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 140;
        display: none;
      }
      .sidebar-overlay.active { display: block; }
    }

    footer {
      text-align: center;
      padding: 1.75rem 1rem;
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    footer strong { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
        <div class="logo-icon">💊</div>
        <div>
          <h1>Guia de Diluição | PenseQuiz</h1>
          <span>Educacional e simulador</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="Buscar medicamento..." autocomplete="off">
        </div>
        <button class="theme-btn" id="themeBtn" title="Alternar tema" aria-label="Modo escuro">🌙</button>
      </div>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="container">
    <aside class="sidebar" id="sidebar">
      <h2>Categorias</h2>
      <ul class="category-list" id="categoryList"></ul>
    </aside>

    <main>
      <div class="results-header">
        <h2 id="resultsTitle">Todos os Medicamentos</h2>
        <span class="results-count" id="resultsCount">0 medicamentos</span>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </main>
  </div>

  <footer>
    <p>Baseado no e-book <strong>Guia de Medicamentos</strong> — 1ª Edição • SINOP 2023</p>
    <p>Corpo discente Turma 2022/2 • Enfermagem UFMT • Sistema para consulta rápida e fins educacionais</p>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <div class="category" id="modalCategory"></div>
          <h2 id="modalTitle"></h2>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const medicamentos = [
      {id:"epinefrina",nome:"Epinefrina",categoria:"Amina vasoativa",subtitulo:"Agonista adrenérgico",apresentacao:"Solução injetável 1 mg/mL (ampola de 1 mL)",vias:["Intramuscular","Endovenoso","Subcutâneo"],estabilidade:"24h refrigerado (5°C)",diluicao:"SG 5%; SF 0,9% — volume de 250 mL a 500 mL (se infusão contínua)",posologia:"Conforme protocolo de emergência e prescrição médica. Em broncoespasmo severo: preferir via subcutânea.",cuidados:["Manter proteção da luz (medicação fotossensível)","Em broncoespasmo severo, administrar subcutâneo","Prever e prover materiais para possíveis emergências","Estimular hidratação"],reacoes:"Aumentar a rigidez e tremores em parkinsonianos; a repetição pode causar danos aos tecidos injetados; náuseas, vômitos, visão turva e aumento da PA."},

      {id:"dopamina",nome:"Dopamina",categoria:"Amina vasoativa",subtitulo:"Vasopressor",apresentacao:"Solução injetável 5 mg/mL (ampola de 10 mL)",vias:["Endovenoso"],estabilidade:"24h em temperatura ambiente (TA)",diluicao:"SG 5%; SF 0,9% — volume de 100 a 250 mL (100 mg) e 500 mL (250 mg)",posologia:"Infusão em AVC controlada por bomba. Descontinuar lentamente (desmame).",cuidados:["Informar ao paciente a ação do medicamento e as reações","Infundir a droga em AVC, controlada por bomba de infusão e descontinuar lentamente (desmame)","Manter o paciente monitorado com ECG","Manter as extremidades do paciente aquecidas"],reacoes:"Náuseas, vômitos, batimentos ectópicos, taquicardia, dispneia, hipotensão, vasoconstrição, angina, bradicardia, hipertensão, palpitações e arritmias ventriculares."},
      {id:"morfina",nome:"Morfina",categoria:"Analgésico narcótico",subtitulo:"Analgésico narcótico",apresentacao:"Comprimido, cápsula, solução injetável, solução oral",vias:["Endovenoso","Epidural"],estabilidade:"48h em temperatura ambiente (TA)",diluicao:"Direta: 2,5-15 mg em 5 mL de AD; Intermitente: 10 mg/mL + 90 mL em SF 0,9% ou SG 5%",posologia:"Dose usual: 2,5 a 15 mg EV. Ajustar conforme dor e tolerância. Monitorar respiração.",cuidados:["Monitorar controle da dor, estado respiratório e mental","Monitorar pressão arterial, sinais de uso indevido, abuso e dependência","Sinais ou sintomas de hipogonadismo e hipoadrenalismo"],reacoes:"Respiração difícil, irregular, rápida, lenta ou superficial; lábios/unha/pele pálidos ou azuis; tontura, vertigem, sedação, náusea, vômito, transpiração, euforia, fraqueza, dor de cabeça."},
      {id:"tramadol",nome:"Cloridrato de Tramadol",categoria:"Analgésico narcótico",subtitulo:"Analgésico narcótico",apresentacao:"Comprimido, solução injetável, solução oral",vias:["Endovenoso","Intramuscular","Subcutâneo","Oral"],estabilidade:"12h em temperatura ambiente (TA)",diluicao:"SF 0,9%; SG 5% a critério médico",posologia:"Conforme prescrição. Avaliar função renal e hepática antes da administração.",cuidados:["Avaliar estado respiratório e mental, PA, FC e função intestinal","Avaliar sinais de hipogonadismo ou hipoadrenalismo","Observar sinais de tolerância, dependência, abuso ou mau uso"],reacoes:"Cefaleia, sonolência, náuseas e vômitos, constipação, boca seca, hiperidrose e fadiga."},
      {id:"fentanil",nome:"Fentanil",categoria:"Analgésico narcótico",subtitulo:"Analgésico narcótico",apresentacao:"Solução injetável (frasco-ampola 2 mL / 5 mL / 10 mL)",vias:["Endovenoso"],estabilidade:"24h após preparo",diluicao:"SG 0,9% ou SG 5%",posologia:"Dose conforme procedimento e peso. Monitorar rigorosamente respiração e sedação.",cuidados:["Monitorar controle da dor, estado respiratório e mental","Monitorar pressão arterial, sinais de uso indevido, abuso e dependência","Sinais ou sintomas de hipogonadismo e hipoadrenalismo"],reacoes:"Broncoespasmos, apneia, hipotensão, hipertensão, distúrbios visuais, sedação, tontura, bradicardia, taquicardia, arritmias, vômitos e náuseas."},
      {id:"dipirona",nome:"Dipirona",categoria:"Analgésico, Antipirético, AINE",subtitulo:"Analgésico / Antipirético / AINE",apresentacao:"Xarope, gotas, comprimidos, solução injetável",vias:["Endovenoso","Intramuscular","Oral"],estabilidade:"Estável até 1h após reconstituição; depois diluir em 100 mL de SF",diluicao:"Pronto para uso, ou diluir em SF 0,9%; SG 5% ou AD em 10 ou 20 mL",posologia:"Não utilizar em crianças < 3 meses e < 5 kg. Não usar na gestação ou lactação.",cuidados:["Não utilizar em crianças < 3 meses e < 5 kg, nem na gestação ou lactação","Informar efeitos adversos e contraindicação do uso concomitante com depressores do SNC"],reacoes:"Dor no estômago ou intestino; má digestão; diarreia; coloração avermelhada da urina; pressão baixa; arritmias cardíacas; ardência ou coceira na pele."},

      {id:"omeprazol",nome:"Omeprazol",categoria:"Redutor de acidez gástrica",subtitulo:"Antiulceroso",apresentacao:"Cápsula 10, 20 e 40 mg; Injetável 40 mg/10 mL",vias:["VO","EV"],estabilidade:"Injetável: 4h em TA depois de reconstituído",diluicao:"Reconstituição: 10 mL de diluente próprio",posologia:"Não usar na gestação ou lactação. Investigar interações medicamentosas.",cuidados:["Não utilizar a medicação durante a gestação ou lactação","Ressaltar a importância de hábitos saudáveis","Investigar o uso de outros medicamentos e possíveis interações medicamentosas"],reacoes:"Dor abdominal, constipação, diarreia, flatulência, náusea/vômito, boca seca, estomatite, candidíase gastrointestinal e colite microscópica, disfunção hepática, disfunção renal."},
      {id:"sulfato-magnesio",nome:"Sulfato de Magnésio",categoria:"Repositores de Eletrólitos",subtitulo:"Eletrólito",apresentacao:"Ampolas plásticas de 10 mL com 10% e 50%",vias:["VO","IO","IM"],estabilidade:"48 horas em TA",diluicao:"IM: pronto para uso; EV: pronto para uso ou diluído em SF ou SG",posologia:"IM 10% pode ser aplicada em adultos e pediatria. EV: adm 150 mg/min (~7 min para cada ampola). Monitorar SSVV, ECG, reflexos e função renal.",cuidados:["IM: 10% pode ser aplicada em adultos e pediatria. Adm IM apenas se o acesso EV não estiver disponível","EV: adm 150 mg/minuto (~7 minutos para cada ampola)","Monitorar SSVV, ECG, reflexos tendinosos profundos e função renal"],reacoes:"Sonolência, hipocalcemia, hipotensão, bradicardia."},
      {id:"gluconato-calcio",nome:"Gluconato de Cálcio",categoria:"Repositores de Eletrólitos",subtitulo:"Eletrólito",apresentacao:"10% (100 mg/mL) em ampola 10 mL (1 g/ampola)",vias:["EV"],estabilidade:"48 horas em TA",diluicao:"EV: diluir em SF ou SG: 10 mL (1 g) em 100 mL (10 mg/mL)",posologia:"Não administrar em neonatos sob tratamento com ceftriaxona. Cautela em pacientes que usam digitálicos.",cuidados:["Não deve ser administrado em neonatos sob tratamento com ceftriaxona, devido ao risco de precipitação do sal ceftriaxona-cálcio","Usar com cautela em pacientes que utilizam digitálicos, pacientes com hiperfosfatemia severa, insuficiência respiratória ou acidose"],reacoes:"Arritmia, bradicardia, parada cardíaca, hipotensão, vasodilatação, síncope (pode ocorrer após injeção intravenosa rápida)."},
      {id:"cloreto-sodio",nome:"Cloreto de Sódio",categoria:"Repositores de Eletrólitos",subtitulo:"Eletrólito",apresentacao:"20% (200 mg/mL) em ampola com 10 mL (2 g/ampola)",vias:["EV"],estabilidade:"24h após diluição",diluicao:"SF 0,9%, SG 5%, RG",posologia:"Monitorar nível de consciência, eletrólitos, bicarbonato, osmolaridade, peso e local da infusão. Em hipertensos: monitorar FC e PA.",cuidados:["Atentar-se ao nível de consciência","Monitorar concentrações de sódio, potássio, cloreto, bicarbonato e osmolaridade","Monitorar peso corporal e local da infusão","Em pacientes hipertensos: monitorar FC e PA"],reacoes:"Insuficiência cardíaca congestiva, hipertensão transitória, hipernatremia, hipocalemia, hipervolemia, hiperhidratação, flebite, trombose."},
      {id:"cloreto-potassio",nome:"Cloreto de Potássio",categoria:"Repositores de Eletrólitos",subtitulo:"Eletrólito",apresentacao:"19,1% – 191 mg/mL = 2,56 mEq/mL (ampola 10 mL)",vias:["EV"],estabilidade:"24h após diluição",diluicao:"SF 0,9%, SG 5%, RG",posologia:"Infusão não deve ser rápida. Não diluir em SG 5% nos casos de hipocalemia grave. Monitorar função renal e local da infusão.",cuidados:["Monitorar função renal","Monitorar demais eletrólitos","Monitorar local da infusão devido risco de flebite","A infusão não deve ser rápida","Não diluir em SG 5% nos casos de hipocalemia grave"],reacoes:"Arritmia, parada cardíaca, hipotensão, hipercalemia."},
      {id:"glicose",nome:"Glicose",categoria:"Repositores de Eletrólitos",subtitulo:"Eletrólito / substrato energético",apresentacao:"Glicose 25% – 250 mg/mL (ampola 10 mL); Glicose 50% – 500 mg/mL (ampola 10 mL)",vias:["EV","VO"],estabilidade:"24h após diluição",diluicao:"Soluções concentradas: diluir para concentração 12,5%. Glic. 50% 10 mL: adm periférico puro",posologia:"Acompanhar glicemia capilar. Monitorar função renal e nível de consciência. Administrar lentamente em crianças e idosos.",cuidados:["Acompanhar glicemia capilar devido risco de hiperglicemia","Monitorar função renal","Monitorar nível de consciência","Administrar lentamente em crianças e idosos"],reacoes:"Edema, desidratação, flebite, trombose no local da administração, acidose, desidratação, síndrome hiperosmolar, hiperglicemia, hipocalemia, hipofosfatemia, hipomagnesemia."},
      {id:"complexo-b",nome:"Complexo B",categoria:"Vitaminas",subtitulo:"Vitaminas hidrossolúveis",apresentacao:"Injetável – ampola 2 mL e drágeas",vias:["EV","IM"],estabilidade:"24h em TA",diluicao:"Pode ser associado a solutos glicosados ou fisiológicos",posologia:"Verificar prazo de validade. Cautela em úlceras pépticas. Não administrar com levodopa. Avaliar uso em pacientes renais crônicos.",cuidados:["Verificar o prazo de validade","Administrar com cautela em pacientes com úlceras pépticas","Não administrar com levodopa","Avaliar uso em pacientes renais crônicos"],reacoes:"Prurido, náuseas, vômitos e reação anafilática; dor e irritação no local da aplicação da injeção."}
    ];

    const categoryList = document.getElementById('categoryList');
    const cardsGrid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const resultsTitle = document.getElementById('resultsTitle');
    const resultsCount = document.getElementById('resultsCount');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const themeBtn = document.getElementById('themeBtn');

    let currentCategory = 'Todos';
    let currentSearch = '';

    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    const categories = ['Todos', ...new Set(medicamentos.map(m => m.categoria))];

    function renderCategories() {
      categoryList.innerHTML = categories.map(cat => {
        const count = cat === 'Todos' ? medicamentos.length : medicamentos.filter(m => m.categoria === cat).length;
        return `<li>
          <button class="category-btn ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}">
            <span>${cat}</span>
            <span class="count">${count}</span>
          </button>
        </li>`;
      }).join('');

      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.cat;
          renderCategories();
          renderCards();
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        });
      });
    }

    function getFilteredMeds() {
      return medicamentos.filter(m => {
        const matchCat = currentCategory === 'Todos' || m.categoria === currentCategory;
        const matchSearch = !currentSearch ||
          m.nome.toLowerCase().includes(currentSearch) ||
          m.subtitulo.toLowerCase().includes(currentSearch) ||
          m.categoria.toLowerCase().includes(currentSearch);
        return matchCat && matchSearch;
      });
    }

    function renderCards() {
      const filtered = getFilteredMeds();
      resultsTitle.textContent = currentCategory === 'Todos' ? 'Todos os Medicamentos' : currentCategory;
      resultsCount.textContent = `${filtered.length} medicamento${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>Nenhum medicamento encontrado</h3><p>Tente ajustar a busca ou selecionar outra categoria.</p></div>`;
        return;
      }

      cardsGrid.innerHTML = filtered.map(m => `
        <article class="med-card" data-id="${m.id}">
          <div class="med-card-header">
            <span class="category-tag">${m.categoria}</span>
            <h3>${m.nome}</h3>
            <div class="subtitle">${m.subtitulo}</div>
          </div>
          <div class="med-card-body">
            <div class="info-row"><span class="label">Vias:</span><span class="value">${m.vias.join(', ')}</span></div>
            <div class="info-row"><span class="label">Estab.:</span><span class="value">${m.estabilidade}</span></div>
          </div>
          <div class="med-card-footer">
            <button class="btn-detail">Ver detalhes</button>
          </div>
        </article>
      `).join('');

      document.querySelectorAll('.med-card').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.id));
      });
    }

    function openModal(id) {
      const m = medicamentos.find(med => med.id === id);
      if (!m) return;

      document.getElementById('modalCategory').textContent = m.categoria;
      document.getElementById('modalTitle').textContent = m.nome;

      document.getElementById('modalBody').innerHTML = `
        <div class="detail-grid">
          <div class="detail-section">
            <h4>📦 Apresentação</h4>
            <p>${m.apresentacao}</p>
          </div>
          <div class="detail-section">
            <h4>💉 Vias de Administração</h4>
            <p>${m.vias.join(' • ')}</p>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-section">
            <h4>⏱️ Estabilidade</h4>
            <p>${m.estabilidade}</p>
          </div>
          <div class="detail-section">
            <h4>🧪 Diluição</h4>
            <p>${m.diluicao}</p>
          </div>
        </div>
        <div class="detail-section">
          <h4>📋 Posologia / Observações</h4>
          <p>${m.posologia}</p>
        </div>
        <div class="detail-section">
          <h4>👩‍⚕️ Cuidados de Enfermagem</h4>
          <ul>${m.cuidados.map(c => `<li>${c}</li>`).join('')}</ul>
        </div>
        <div class="detail-section">
          <h4>⚠️ Reações Adversas</h4>
          <p>${m.reacoes}</p>
        </div>
      `;

      modalOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.trim().toLowerCase();
      renderCards();
    });

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    });
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('active');
    });

    renderCategories();
    renderCards();
  </script>
</body>
</html>
